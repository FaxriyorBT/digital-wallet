spring:
  application:
    name: digital-wallet
  config:
    # lets the app pick up the same .env file that docker compose uses
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wallet}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: "wallet:"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  time-zone: Asia/Tashkent
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: digital-wallet
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    login:
      max-attempts: 5
      lock-duration: 15m
  admin:
    email: ${ADMIN_EMAIL:admin@wallet.local}
    password: ${ADMIN_PASSWORD:}
    full-name: System Administrator
    phone: "+998900000000"
  transfer:
    fee-percent: 0.5
    limits:
      UZS:
        min-amount: 1000
        max-amount: 20000000
        daily-amount: 50000000
        max-top-up: 50000000
      USD:
        min-amount: 1
        max-amount: 2000
        daily-amount: 5000
        max-top-up: 5000
      EUR:
        min-amount: 1
        max-amount: 2000
        daily-amount: 5000
        max-top-up: 5000
  exchange:
    cbu-url: https://cbu.uz
    connect-timeout: 3s
    read-timeout: 5s
    sync-enabled: true
    sync-cron: "0 5 */3 * * *"
  ledger:
    reconciliation-cron: "0 0 2 * * *"
  outbox:
    poll-interval: PT2S
    batch-size: 50
    send-timeout: 5s
    retention: 7d
  notification:
    from: no-reply@wallet.local

resilience4j:
  retry:
    instances:
      cbu:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      cbu:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # emails are sent asynchronously, a slow mail server must not mark the whole application as down
    mail:
      enabled: false

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
